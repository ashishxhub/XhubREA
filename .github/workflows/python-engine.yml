name: Python Analysis Engine Tests

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-engine.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install optional API test dependencies
        run: python -m pip install 'fastapi>=0.110,<1.0'
      - name: Compile Python modules
        run: python -m compileall -q python
      - name: Run unit tests
        working-directory: python
        run: python -m unittest discover -s tests -v

  antigravity-sdk-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install optional Antigravity backend dependency
        run: python -m pip install -r python/requirements-antigravity.txt
      - name: Verify SDK imports
        run: |
          python -c "from google.antigravity import Agent, LocalAgentConfig; print('Antigravity SDK imports successfully')"
