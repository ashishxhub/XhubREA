name: Python Analysis Engine Tests

on:
  push:
    branches: [main, feature/antigravity-core-hardening]
    paths:
      - "python/**"
      - ".github/workflows/python-engine.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional API test dependencies
        run: python -m pip install 'fastapi>=0.110,<1.0' httpx2
      - name: Compile Python modules
        run: python -m compileall -q python
      - name: Run unit tests
        working-directory: python
        run: python -m unittest discover -s tests -v

  antigravity-sdk-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional Antigravity backend dependency
        run: python -m pip install -r python/requirements-antigravity.txt
      - name: Verify SDK package, imports, and agent construction
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from google.antigravity import Agent, LocalAgentConfig

          installed = version("google-antigravity")
          assert installed.startswith("0.1."), installed
          config = LocalAgentConfig(
              system_instructions="XhubREA read-only authorized software research."
          )
          agent = Agent(config)
          assert agent is not None
          print(f"Antigravity SDK {installed}: imports and Agent construction passed")
          PY
