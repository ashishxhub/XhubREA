name: Backend Container CI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "python/**"
      - ".github/workflows/backend-container.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "python/**"
      - ".github/workflows/backend-container.yml"

permissions:
  contents: read

jobs:
  build-backend-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: xhubrea/research-api:ci
