name: Web Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - "web-dashboard/**"
      - ".github/workflows/web-dashboard.yml"
  pull_request:
    paths:
      - "web-dashboard/**"
      - ".github/workflows/web-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-dashboard/package.json
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
